<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="border" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00D2FF" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#3A7BD5" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="aGrad" x1="8" y1="14" x2="40" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00D2FF"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
    <linearGradient id="accent" x1="10" y1="52" x2="54" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00D2FF"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0.4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.8" result="blur"/>
      <feFlood flood-color="#00D2FF" flood-opacity="0.6" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- Gradient border ring -->
  <rect x="1" y="1" width="62" height="62" rx="13" stroke="url(#border)" stroke-width="1.5" fill="none"/>

  <!-- Subtle top glow -->
  <ellipse cx="32" cy="8" rx="22" ry="7" fill="#00D2FF" fill-opacity="0.05"/>

  <!-- "A" — cyan, with glow -->
  <text
    x="7"
    y="44"
    font-family="'Arial Black', 'Impact', Arial, sans-serif"
    font-weight="900"
    font-size="36"
    fill="url(#aGrad)"
    filter="url(#glow)"
  >A</text>

  <!-- "P" — white, softer -->
  <text
    x="33"
    y="44"
    font-family="'Arial Black', 'Impact', Arial, sans-serif"
    font-weight="900"
    font-size="36"
    fill="#ffffff"
    fill-opacity="0.80"
  >P</text>

  <!-- Bottom accent line -->
  <rect x="10" y="50" width="44" height="2.5" rx="1.25" fill="url(#accent)"/>

  <!-- Top-right pulse dot -->
  <circle cx="53" cy="11" r="4" fill="#00D2FF" fill-opacity="0.18"/>
  <circle cx="53" cy="11" r="2.2" fill="#00D2FF" fill-opacity="0.7"/>
  <circle cx="53" cy="11" r="1" fill="#ffffff" fill-opacity="0.9"/>
</svg>
